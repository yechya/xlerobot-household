version: 1

# Calibrated table-edge docking profiles. Every value is hashed into the
# deployment fingerprint and the mission token. Install as
# /etc/robot-agent/tables.yaml and point ROBOT_AGENT_TABLE_CATALOG at it.
tables:
  dining_table_edge:
    standoff_m: 0.45
    distance_tolerance_m: 0.06
    lateral_tolerance_m: 0.04
    yaw_tolerance_deg: 3.0
    min_confidence: 0.6
    max_step_m: 0.12
    max_step_yaw_deg: 6.0
    max_steps: 12
    deadline_seconds: 60.0
    settle_seconds: 0.6

  drawer_cabinet_edge:
    standoff_m: 0.42
    distance_tolerance_m: 0.04
    lateral_tolerance_m: 0.03
    yaw_tolerance_deg: 2.0
    min_confidence: 0.65
    max_step_m: 0.10
    max_step_yaw_deg: 5.0
    max_steps: 14
    deadline_seconds: 75.0
    settle_seconds: 0.6
