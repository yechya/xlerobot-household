[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xlerobot-segmentation-grounded-sam2"
version = "0.1.0"
description = "GroundingDINO and SAM2 provider for XLeRobot segmentation"
requires-python = ">=3.10"
dependencies = [
  "xlerobot-segmentation-server>=0.1,<0.2",
  "numpy>=1.24.4",
  "Pillow>=9.4.0",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
  "groundingdino @ git+https://github.com/IDEA-Research/GroundingDINO.git@856dde20aee659246248e20734ef9ba5214f5e44",
]

[project.entry-points."xlerobot.segmentation_providers"]
grounded_sam2_v1 = "xlerobot_segmentation_grounded_sam2.provider:create_provider"

[tool.setuptools.packages.find]
include = ["xlerobot_segmentation_grounded_sam2*"]
