[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xlerobot-agent"
version = "0.1.0"
description = "Standalone, safety-gated runtime for household service robots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "numpy>=1.24.4",
  "Pillow>=9.4.0",
]
ros2 = [
  "pyzmq>=25",
]

[project.scripts]
robotctl = "robot_agent.cli:main"
robotd = "robot_agent.service:main"
robot-camera = "robot_agent.camera_server:main"
robot-watchdog = "robot_agent.watchdog:main"
robot-hil-evaluate = "robot_agent.hil:main"
robot-hil-record = "robot_agent.hil_recorder:main"
robot-bringup-check = "robot_agent.bringup:main"
robot-base-bridge = "robot_agent.base_bridge_node:main"
robot-policy-check = "robot_agent.policies:main"
robot-policy-materialize = "robot_agent.policy_materialize:main"
robot-benchmark-evaluate = "robot_agent.benchmarks:main"
robot-episode-check = "robot_agent.episodes:main"
robot-episode-evidence = "robot_agent.episode_evidence:main"
robot-episode-replay-plan = "robot_agent.episode_replay:main"
robot-episode-replay = "robot_agent.episode_replay_runtime:main"
robot-data-triage = "robot_agent.data_triage:main"
robot-evo-rl-export = "robot_agent.evo_rl:main"
robot-acceptance-bind = "robot_agent.acceptance:main"
robot-experiment-evaluate = "robot_agent.experiments:main"
robot-web = "robot_agent.webui:main"

[project.entry-points."xlerobot.replay_handlers"]
evidence_export_v1 = "robot_agent.episode_replay_runtime:create_evidence_export_handler"

[tool.setuptools.packages.find]
include = ["robot_agent*"]

[tool.setuptools.package-data]
robot_agent = ["data/*.yaml", "webui/*.html", "webui/*.css", "webui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = [
  ".",
  "plugins/xlerobot_segmentation_grounded_sam2",
  "plugins/xlerobot_segmentation_http",
  "plugins/xlerobot_segmentation_server",
  "plugins/xlerobot_replay_ffmpeg",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
